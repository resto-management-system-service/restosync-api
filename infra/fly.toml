# Shared environment. Auto-deployed on every merge to main by
# .github/workflows/release.yml. Used as "dev" for now — a separate prod app
# can be split out later (re-add infra/fly.dev.toml and repoint the deploy job).
# Secrets (not here): DATABASE_URL, JWT_SECRET, JWT_REFRESH_SECRET, TAX_RATE,
# STRIPE_*  — set with `flyctl secrets set -a restosync-api ...`.
app            = "restosync-api"
primary_region = "iad"

[build]
  dockerfile = "../Dockerfile"

[env]
  NODE_ENV               = "production"
  APP_PORT               = "3000"
  API_PREFIX             = "api"
  JWT_EXPIRES_IN         = "15m"
  JWT_REFRESH_EXPIRES_IN = "7d"
  STRIPE_CURRENCY        = "usd"
  # Browser origins allowed to call the API (restosync-web). See common/cors.ts.
  CORS_ORIGINS           = "https://textilescross-app.vercel.app,https://*.vercel.app,http://localhost:3001,http://localhost:3000"

[deploy]
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port      = 3000
  force_https        = true
  auto_stop_machines = true
  auto_start_machines = true

  [[http_service.checks]]
    interval     = "30s"
    timeout      = "5s"
    grace_period = "10s"
    path         = "/health"

[[vm]]
  memory = "512mb"
  cpus   = 1
