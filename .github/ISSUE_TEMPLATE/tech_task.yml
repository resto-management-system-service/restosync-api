name: Tech Task
description: Technical improvement, refactor, or process change
labels: ["tech-task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What problem does this solve and why does it matter?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: Concrete, actionable steps to complete this task
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is done?
    validations:
      required: true
