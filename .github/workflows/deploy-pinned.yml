name: Deploy pinned version

# Manually deploy a specific released image tag to the shared Fly app
# (restosync-api) — used to roll back after a bad auto-deploy from main, or
# to pin the environment to a known-good version. When a separate prod
# environment is split out, repoint this at that app.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Image tag to deploy, matching an existing release
          (e.g. "v0.1.5"). Must already exist in registry.fly.io as
          restosync-api:<version>. Use an older tag here to roll back.
        required: true
        type: string

jobs:
  deploy:
    name: Deploy pinned image to Fly.io
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION' — expected format vX.Y.Z (e.g. v0.1.5)"
            exit 1
          fi
          echo "Deploying registry.fly.io/restosync-api:${VERSION} to the shared env"

      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - run: >
          flyctl deploy
          --image registry.fly.io/restosync-api:${{ inputs.version }}
          --app restosync-api
          --config infra/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
